[package]
name = "md-viewer"
version = "0.1.0"
description = "Markdown viewer built with Rust + Tauri"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "md_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
